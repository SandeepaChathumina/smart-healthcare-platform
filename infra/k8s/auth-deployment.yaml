apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: auth-service-secret