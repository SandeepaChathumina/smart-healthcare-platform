version: "3.8"

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  auth-service:
    build: ../../services/auth-service
    ports:
      - "5001:5001"
    environment:
      - INTERNAL_SERVICE_API_KEY=my_internal_key_123
    depends_on:
      - mongo

  doctor-service:
    build: ../../services/doctor-service
    ports:
      - "5003:5003"
    depends_on:
      - mongo

  appointment-service:
    build: ../../services/appointment-service
    ports:
      - "5004:5004"
    depends_on:
      - mongo

  patient-service:
    build: ../../services/patient-service
    container_name: patient-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/smart_healthcare
      - JWT_SECRET=${JWT_SECRET}
      - FILE_UPLOAD_PATH=./uploads
      - MAX_FILE_SIZE=5242880
    depends_on:
      - mongo
    volumes:
      - ../../services/patient-service:/app
      - /app/node_modules
      - patient_uploads:/app/uploads

  notification-service:
    build: ../../services/notification-service
    ports:
      - "5011:5010"
    environment:
      - PORT=5010
      - MONGO_URI=mongodb://mongo:27017/smart_healthcare
      - AUTH_SERVICE_URL=http://auth-service:5001
      - INTERNAL_SERVICE_API_KEY=my_internal_key_123
    depends_on:
      - mongo
      - auth-service

  frontend:
    build: ../../frontend
    ports:
      - "3000:3000"

volumes:
  patient_uploads: